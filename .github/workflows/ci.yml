name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI never calls Groq and needs no secrets: every /api call in E2E tests is mocked.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: i18n checks
        run: npm run check:i18n && npm run check:strings
      - name: Licence check
        run: npm run check:licences
      - name: Secret check
        run: npm run check:secrets
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (mocked API)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
